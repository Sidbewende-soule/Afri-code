<!-- BARRE DE NAVIGATION (Fidèle à la maquette de référence Afri-code) -->
<header class="bg-[#FFF9F0] w-full z-50 sticky top-0 transition-colors">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20 sm:h-24">
      
      <!-- 1. LOGO AFRI-CODE (Symbole Afri-Code_LOGO.png + texte Afri-code) -->
      <a routerLink="/" (click)="closeMobileMenu()" class="flex items-center gap-2.5 group focus:outline-none">
        <img 
          src="Afri-Code_LOGO.png" 
          alt="Emblème Afri-code" 
          class="h-9 sm:h-11 w-auto object-contain"
          width="44"
          height="44"
        />
        <span class="text-2xl sm:text-[26px] font-extrabold tracking-tight font-['Plus_Jakarta_Sans']">
          <span class="text-[#292F36]">Afri-</span><span class="text-[#FF8200]">code</span>
        </span>
      </a>

      <!-- 2. LIENS DE NAVIGATION CENTRÉS -->
      <nav class="hidden md:flex items-center space-x-7 lg:space-x-9" aria-label="Navigation principale">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            [routerLinkActiveOptions]="{ exact: !!item.exact }"
            routerLinkActive="active-nav-link"
            class="nav-link relative text-sm lg:text-[15px] font-medium text-[#292F36] hover:text-[#FF8200] transition-colors py-1.5 cursor-pointer"
          >
            {{ item.label }}
            <!-- Trait orange actif pour l'élément courant -->
            <span class="nav-active-bar hidden absolute -bottom-1 left-1/2 -translate-x-1/2 w-8 h-[2.5px] bg-[#FF8200] rounded-full"></span>
          </a>
        }
      </nav>

      <!-- 3. BOUTON ORANGE ARRONDI « Nous contacter → » -->
      <div class="hidden md:flex items-center">
        <a
          routerLink="/contact"
          class="inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-full text-sm font-semibold text-white bg-[#FF8200] hover:bg-[#E67500] active:scale-98 transition-all shadow-sm hover:shadow-md cursor-pointer group"
        >
          <span>Nous contacter</span>
          <svg class="w-4 h-4 text-white transform group-hover:translate-x-0.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </a>
      </div>

      <!-- Hamburger mobile -->
      <div class="flex items-center md:hidden">
        <button
          type="button"
          (click)="toggleMobileMenu()"
          class="p-2 rounded-xl text-[#292F36] hover:text-[#FF8200] hover:bg-black/5 focus:outline-none focus:ring-2 focus:ring-[#FF8200]"
          [attr.aria-expanded]="isMobileMenuOpen()"
          aria-label="Menu principal"
        >
          @if (!isMobileMenuOpen()) {
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          } @else {
            <svg class="h-6 w-6 text-[#FF8200]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      </div>

    </div>
  </div>

  <!-- Menu Mobile Déroulant -->
  @if (isMobileMenuOpen()) {
    <div class="md:hidden border-t border-[#FF8200]/15 bg-[#FFF9F0] px-4 pt-3 pb-6 space-y-2 shadow-lg animate-fadeIn">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          routerLinkActive="text-[#FF8200] font-bold bg-[#FF8200]/10"
          (click)="closeMobileMenu()"
          class="block px-3.5 py-2.5 rounded-xl text-base font-medium text-[#292F36] hover:bg-[#FF8200]/10 hover:text-[#FF8200] transition-colors"
        >
          {{ item.label }}
        </a>
      }
      <div class="pt-3 border-t border-[#FF8200]/15">
        <a
          routerLink="/contact"
          (click)="closeMobileMenu()"
          class="flex items-center justify-center gap-2 w-full py-3 rounded-full text-sm font-semibold text-white bg-[#FF8200] hover:bg-[#E67500] shadow-sm"
        >
          <span>Nous contacter</span>
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </a>
      </div>
    </div>
  }
</header>
