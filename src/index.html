<div id="africode-loader" role="status" aria-label="Chargement">
  <div class="ac-panel ac-pl"></div><div class="ac-panel ac-pr"></div>
  <canvas class="ac-fx"></canvas>
  <div class="ac-stage">

      <defs><filter id="ac-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter></defs>

      <g class="ac-bl"><path fill="#F0E2CB" stroke="#F0E2CB" stroke-width="14" stroke-linejoin="round" d="M345,400 L450,400 L456,410 L272,588 L272,605 L440,772 L432,788 L345,788 L330,780 L170,615 L168,590 L330,407Z"/></g>
      <g class="ac-br"><path fill="#F0E2CB" stroke="#F0E2CB" stroke-width="14" stroke-linejoin="round" d="M858,400 L766,400 L762,412 L937,592 L937,608 L770,772 L778,788 L860,788 L875,780 L1040,612 L1042,590 L870,407Z"/></g>

        <path class="ac-g" d="M304,392 L304,335 L387,232 L519,215 L578,280 L714,280 L760,330 L760,352"/>
        <path class="ac-g" d="M697,380 L536,704 L512,720 L555,722 L600,765 L600,832 L655,907 L636,982 L716,1105 L758,1060 L758,1018 L816,945 L816,888 L866,846 L872,815"/>
        <path class="ac-g" d="M972,900 L922,958 L922,1008 L888,1050 L890,1088"/>

      <g class="ac-main" fill="none" stroke="#F18F08" stroke-width="47" stroke-linejoin="miter" stroke-miterlimit="3">
        <path class="ac-t" d="M304,392 L304,335 L387,232 L519,215 L578,280 L714,280 L760,330 L760,352"/>
        <path class="ac-t" d="M697,380 L536,704 L512,720 L555,722 L600,765 L600,832 L655,907 L636,982 L716,1105 L758,1060 L758,1018 L816,945 L816,888 L866,846 L872,815"/>
        <path class="ac-t" d="M972,900 L922,958 L922,1008 L888,1050 L890,1088"/>

<style>
  #africode-loader{position:fixed;inset:0;z-index:9999;overflow:hidden;font-family:"DM Mono",ui-monospace,Menlo,Consolas,monospace}
  #africode-loader .ac-panel{position:absolute;top:0;bottom:0;width:50%;background:#140B04}
  #africode-loader .ac-pl,#africode-loader .ac-pr{background:radial-gradient(circle at 50% 46%,rgba(241,143,8,.16),transparent 30%),#140B04;background-size:200% 100%}
  #africode-loader .ac-pl{left:0;width:calc(50% + 1px);background-position:0 0}
  #africode-loader .ac-pr{right:0;background-position:100% 0}
  #africode-loader .ac-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #africode-loader .ac-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
  #africode-loader .ac-logo{width:min(220px,48vw);height:auto;overflow:visible}
  #africode-loader .ac-meta{display:flex;align-items:baseline;gap:18px;color:#F0E2CB;font-size:14px;letter-spacing:.4em}
  #africode-loader .ac-word b{color:#F18F08;font-weight:500}
  #africode-loader .ac-pct{color:#F18F08;font-variant-numeric:tabular-nums;letter-spacing:.12em;min-width:4ch}
  #africode-loader .ac-pct:after{content:"%";opacity:.6}
</style>
<script>
(function(){
  var R=document.getElementById("africode-loader"); if(!R) return;
  var svg=R.querySelector("svg"), T=[].slice.call(R.querySelectorAll(".ac-t")), G=[].slice.call(R.querySelectorAll(".ac-g")),
      head=R.querySelector(".ac-head"), ring=R.querySelector(".ac-ring"), bl=R.querySelector(".ac-bl"), br=R.querySelector(".ac-br"),
      main=R.querySelector(".ac-main"), glow=R.querySelector(".ac-glowg"), pctEl=R.querySelector(".ac-pct"), stage=R.querySelector(".ac-stage"),
      pl=R.querySelector(".ac-pl"), pr=R.querySelector(".ac-pr"), cv=R.querySelector(".ac-fx"), cx=cv.getContext("2d");
  var lens=T.map(function(p){return p.getTotalLength()}), total=lens.reduce(function(a,b){return a+b},0);
  var demo=!!window.AFRICODE_DEMO, reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var C=3600, start=performance.now(), parts=[], pct=0, loaded=false, exitT=0, burstCyc=-1, dpr=1, W=0, H=0;
  var GL="<>/{};01=()[]".split(""),PC=["241,143,8","255,179,71","240,226,203","241,143,8"];
  function size(){var b=R.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=b.width;H=b.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
  size(); addEventListener("resize",size);
  function cl(x){return x<0?0:x>1?1:x}
  function io(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
  function back(x){var a=1.9,b=a+1;return 1+b*Math.pow(x-1,3)+a*Math.pow(x-1,2)}
  function scr(pt){var m=svg.getScreenCTM(),r=R.getBoundingClientRect(),q=svg.createSVGPoint();q.x=pt.x;q.y=pt.y;q=q.matrixTransform(m);return{x:q.x-r.left,y:q.y-r.top}}
  function emit(x,y,n,spd){for(var i=0;i<n;i++){var a=Math.random()*6.283,s=(.3+Math.random())*spd;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.3,l:0,m:40+Math.random()*50,c:Math.random()<.6?GL[(Math.random()*GL.length)|0]:null,z:11+Math.random()*9,k:PC[(Math.random()*PC.length)|0]})}}
  function draw(d,e){var acc=0,L=d*total,E=e*total,hp=null;
    for(var i=0;i<T.length;i++){var l=lens[i],dr=Math.max(0,Math.min(l,L-acc)),er=Math.max(0,Math.min(l,E-acc)),v=Math.max(0,dr-er),da="0 "+er+" "+v+" "+(l*2);
      T[i].style.strokeDasharray=da;G[i].style.strokeDasharray=da;if(!hp&&dr>0&&dr<l)hp=T[i].getPointAtLength(dr);acc+=l}return hp}
  function reset(now){start=now;pct=0;loaded=false;exitT=0;parts=[];burstCyc=-1;[pl,pr,stage].forEach(function(n){n.style.transform="";n.style.opacity=""})}
  function frame(now){
    var t=now-start, cyc=Math.floor(t/C), p=reduce?.7:(t%C)/C;
    var bin=back(cl(p/.2)), bout=io(cl((p-.86)/.14)), pulse=(p>.58&&p<.76)?Math.sin((p-.58)/.18*Math.PI):0;
    var dx=(1-bin)*340+pulse*34+bout*340, rot=(1-bin)*28-bout*20, op=cl(p/.06)*(1-bout);
    bl.setAttribute("transform","translate("+(-dx)+" 0) rotate("+(-rot)+" 310 594)");bl.style.opacity=op;
    br.setAttribute("transform","translate("+dx+" 0) rotate("+rot+" 900 594)");br.style.opacity=op;
    var hp=draw(io(cl((p-.08)/.5)),io(cl((p-.8)/.18)));
    if(hp&&!reduce){head.setAttribute("transform","translate("+hp.x+" "+hp.y+")");head.setAttribute("opacity",1);var s=scr(hp);if(Math.random()<.6)emit(s.x,s.y,1,2.4)}else head.setAttribute("opacity",0);
    if(!reduce&&p>=.58&&burstCyc!==cyc){burstCyc=cyc;var c=scr({x:600,y:660});emit(c.x,c.y,60,7)}
    var q=cl((p-.58)/.32);ring.setAttribute("r",60+q*560);ring.setAttribute("opacity",q>0&&q<1?(1-q)*.9:0);ring.setAttribute("stroke-width",2+(1-q)*14);
    main.setAttribute("stroke-width",47+pulse*7);glow.setAttribute("opacity",.45+pulse*.55);
    pct+=loaded?(100-pct)*.09:(96-pct)*.02; if(loaded&&pct>99.4)pct=100;
    pctEl.textContent=("00"+Math.floor(pct)).slice(-3);
    if(loaded&&pct===100&&!exitT){exitT=now;var c2=scr({x:600,y:660});emit(c2.x,c2.y,120,11)}
    cx.clearRect(0,0,W,H);cx.textAlign="center";cx.textBaseline="middle";
    for(var i=parts.length-1;i>=0;i--){var o=parts[i];o.l++;o.x+=o.vx;o.y+=o.vy;o.vx*=.965;o.vy=o.vy*.965-.02;var a=1-o.l/o.m;if(a<=0){parts.splice(i,1);continue}
      cx.fillStyle="rgba("+o.k+","+(a*a).toFixed(3)+")";
      if(o.c){cx.font="500 "+(o.z|0)+"px 'DM Mono',ui-monospace,monospace";cx.fillText(o.c,o.x,o.y)}else{cx.beginPath();cx.arc(o.x,o.y,o.z/7,0,6.283);cx.fill()}}
    if(exitT){var x=io(cl((now-exitT-250)/900));
      pl.style.transform="translateX("+(-x*101)+"%)";pr.style.transform="translateX("+(x*101)+"%)";
      stage.style.transform="scale("+(1+x*.6)+")";stage.style.opacity=1-cl(x*1.6);
      if(x>=1){if(demo){if(now-exitT>2200)reset(now)}else{R.remove();return}}}
    requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  var MIN_TIME=2800;
  function done(){
    var elapsed=performance.now()-start;
    var wait=Math.max(0,MIN_TIME-elapsed);
    setTimeout(function(){loaded=true},wait);
  }
  window.africodeLoader={finish:function(){done()}};
  if(!demo){if(document.readyState==="complete")done();else addEventListener("load",done)}
})();
</script>
